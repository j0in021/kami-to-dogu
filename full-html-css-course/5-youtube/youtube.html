<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube Clone</title>
    <link rel="stylesheet" href="style.css">
    <link  rel="icon" href="img/icons/logo-videolab.svg">
</head>
<body>
    <header>
        <img class="humbaerger" src="img/icons/icon-menu.svg" alt="メニュー">
        <img class="logo-videolab" src="img/icons/logo-videolab.svg" alt="icon">
        <input class="search_window" type="text" placeholder="検索">
        <img class="search_icon"src="img/icons/icon-search.svg" alt="musimegane">
        <img class="mic" src="img/icons/icon-microphone.svg" alt="mic">
        <img class="create" src="img/icons/icon-create.svg" alt="create">
        <img class="apps" src="img/icons/icon-apps.svg" alt="apps">
        <img class="notifications" src="img/icons/icon-notifications.svg" alt="notification">
        <img class="avatar-profile" src="img/icons/avatar-profile.svg" alt="avatar-profile">
    </header>
    <main>
        <div class="video-card">
            <div class="thumbnail-row">
                <img class="thumbnail" src="img/thumbnail-01-code-workspace.png">
            </div>
            <div class="video-info-row">

                <div class="channel-picture">
                    <img class="profile-picture"
                    src="img/icons/avatar-profile.svg"
                    alt="投稿者プロフィール">   
                </div>
                
                <div class="video-info">
                    <p class="video-title">HTMLとCSSを学ぶ</p>
                    <p class="video-author">VideoLab</p>
                    <p class="video-stats">150万回視聴 &#183; 6か月前</p>
                </div>
            </div>
        </div>
        
        <div class="video-card">
            <div class="thumbnail-row">
                <img class="thumbnail" src="img/thumbnail-02-keyboard-desk.png">
            </div>
            <div class="video-info-row">

                <div class="channel-picture">
                    <img class="profile-picture" src="img/icons/avatar-profile.svg" alt="投稿者プロフィール">  
                </div>
                <div class="video-info">
                    <p class="video-title">集中できる作業環境の作り方</p>
                    <p class="video-author">DeskLab</p>
                    <p class="video-stats">82万回視聴 &#183; 2か月前</p>
                </div>
            </div>
        </div>

        <section class="left_menu">
            <div class="menu_Home"></div>
            <div class="menu_Explore"></div>
            <div class="menu_Subscriptions"></div>
            <div class="menu_Originals"></div>
            <div class="menu_YouTube_Music"></div>
            <div class="menu_Library"></div>
            
        </section>
    </main>
</body>
</html>
