<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>店舗管理 | 紙と道具</title>
  <style>
    :root{--orange:#ff6500;--ink:#161a20;--cream:#fff8ee;--line:#d7d1c7}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:"Noto Sans JP","Yu Gothic",system-ui,sans-serif;line-height:1.5}button,input{font:inherit}button{cursor:pointer}.top{background:var(--ink);color:#fff;padding:20px 0}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:21px;font-weight:900;display:flex;align-items:center;gap:8px}.brand-dot{display:inline-block;width:18px;height:18px;background:var(--orange);border-radius:50%}a{color:inherit}.top a{font-size:13px}.intro{padding:48px 0 20px}.eyebrow{font-size:12px;color:#a63c00;letter-spacing:.14em;font-weight:900}.intro h1{font-size:clamp(35px,5vw,60px);letter-spacing:-.06em;margin:10px 0}.intro p{color:#555;max-width:650px}.panel{background:#fff;border:1px solid var(--line);padding:clamp(22px,4vw,40px);margin:20px 0 80px}.panel h2{margin:0 0 20px}.login{max-width:460px}.field{display:block;margin:18px 0;font-size:13px;font-weight:800}.field input{display:block;width:100%;margin-top:6px;padding:13px;border:1.5px solid #777;border-radius:0}.action{background:var(--orange);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:11px 20px;font-weight:850}.action.secondary{background:#fff}.action.danger{background:#fff;color:#9b1e10;border-color:#9b1e10}.action:disabled{opacity:.5;cursor:not-allowed}.message{min-height:1.5em;color:#9b1e10;font-weight:700}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.toolbar>div{display:flex;gap:8px}.orders{display:grid;gap:14px;margin-top:25px}.order{border:1px solid var(--line);padding:22px;background:#fff}.order-head{display:flex;justify-content:space-between;gap:16px;align-items:start}.order-id{font-weight:900;word-break:break-all}.status{display:inline-block;border-radius:999px;background:#fff1db;padding:5px 13px;font-size:12px;font-weight:900}.status.accepted{background:#dff2df}.status.rejected{background:#fbe2dc}.status.shipped{background:#e0e9f8}.order-meta{display:flex;gap:20px;flex-wrap:wrap;margin:12px 0;color:#555;font-size:13px}.order-items{border-top:1px solid var(--line);padding-top:12px}.order-items div{display:flex;justify-content:space-between;gap:12px;padding:3px 0}.order-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.order-actions button{font-size:13px}.notice{background:#fff1db;padding:14px 18px;font-size:13px;font-weight:700}.empty{color:#555;padding:35px 0}.hidden{display:none!important}@media(max-width:600px){.top .wrap{align-items:start}.order-head{display:block}.status{margin-top:10px}.panel{margin-bottom:35px}}
  </style>
</head>
<body>
  <header class="top"><div class="wrap"><div class="brand"><span class="brand-dot" aria-hidden="true"></span>紙と道具　店舗管理</div><a href="orange-stationery-store.html">お店の画面へ戻る</a></div></header>
  <main class="wrap"><div class="intro"><span class="eyebrow">SHOP ADMIN / DEMO</span><h1>注文を確認する。</h1><p>学習用の架空注文だけを扱う管理画面です。注文の受付、お断り、発送完了を記録できます。実際の配送・課金は行いません。</p></div>
    <div class="notice" id="setup-notice">接続状態を確認しています…</div>
    <section class="panel login" id="login-panel" aria-labelledby="login-title"><h2 id="login-title">店舗担当者ログイン</h2><form id="login-form"><label class="field">メールアドレス<input name="email" type="email" autocomplete="username" required></label><label class="field">パスワード<input name="password" type="password" autocomplete="current-password" required></label><button class="action" type="submit" id="login-button">ログイン</button><p class="message" id="login-message" role="alert"></p></form></section>
    <section class="panel hidden" id="orders-panel" aria-labelledby="orders-title"><div class="toolbar"><h2 id="orders-title">注文一覧</h2><div><button class="action secondary" type="button" id="refresh-button">更新</button><button class="action secondary" type="button" id="logout-button">ログアウト</button></div></div><p class="message" id="orders-message" role="alert"></p><div class="orders" id="orders-list"></div></section>
  </main>
  <script src="admin.js" defer></script>
</body>
</html>
